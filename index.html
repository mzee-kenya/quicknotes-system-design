
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>

<body>
    <main class="container">
        <header>
            <h1>QuickNotes</h1>
            <p>Manage your notes using an online API.</p>
        </header>

        <section class="notes-section">
            <button id="load-btn" type="button">
                Load Notes
            </button>

            <p id="status" aria-live="polite">
                Click "Load Notes" to load your notes.
            </p>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note title</label>
                    <input
                        type="text"
                        id="title-input"
                        maxlength="100"
                        required
                        placeholder="Enter note title"
                    >
                </div>

                <div class="form-group">
                    <label for="body-input">Note body</label>
                    <textarea
                        id="body-input"
                        rows="5"
                        placeholder="Enter note body (optional)"
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">
                    Create Note
                </button>
            </form>

            <h2>Notes</h2>

            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
